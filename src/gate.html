<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Detour の解除フロー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="title">解除フロー</h1>
    <p class="note">このタブを前面に出したまま待ってください。別のタブやウィンドウに移ると、待ち時間は最初からやり直しになります。</p>
    <div class="timer" id="timer">--:--</div>
    <p class="error" id="notice"></p>
    <h2>なぜ今それが必要ですか</h2>
    <textarea id="reason"></textarea>
    <p class="note" id="count"></p>
    <p>
      <button id="complete" disabled>実行する</button>
      <a href="options.html" id="cancel">やめる</a>
    </p>
  </main>
  <script type="module" src="gate-page.js"></script>
</body>
</html>
