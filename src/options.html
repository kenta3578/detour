<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detour の設定</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings">
    <header class="head">
      <h1>Detour</h1>
      <div class="state">
        <span class="pill" id="status" role="status"></span>
        <button id="unlock" hidden></button>
        <button id="lock" hidden>今すぐ戻す</button>
      </div>
    </header>

    <section>
      <h2>迂回させるサイト</h2>
      <form id="add-form" class="inline">
        <input id="pattern" placeholder="例: youtube.com" autocomplete="off" aria-label="迂回させるサイト">
        <button class="primary">追加</button>
      </form>
      <p class="error" id="add-error" role="status"></p>
      <ul class="list" id="patterns"></ul>
      <p class="note" id="gate-note"></p>
      <p class="note">迂回にはそのサイトへのアクセス許可が要ります。許可がないサイトはブロックだけします。</p>
    </section>

    <section>
      <h2>リダイレクト先</h2>
      <form id="redirect-form" class="inline">
        <input id="redirect" placeholder="https://..." autocomplete="off" aria-label="リダイレクト先">
        <button id="redirect-button">設定</button>
      </form>
      <p class="error" id="redirect-error" role="status"></p>
      <p class="note">未設定のあいだは Detour の案内ページに迂回します。一度設定したあとの変更は解除フローを通ります。</p>
    </section>

    <section>
      <h2>解除の記録</h2>
      <ul class="log" id="log"></ul>
      <p class="note" id="log-empty">まだありません。</p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
